[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# The shared engine code (github.com/artembobkin/ImmersiveMapCore), pinned to a
# commit. To build against a local checkout of it, add a `[patch]` section
# naming its crates by path while you work, without committing it.
pmtiles = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "f089003851157e645898350df00086d3e27d7c45" }
tile-prep = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "f089003851157e645898350df00086d3e27d7c45" }
ground-relief = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "f089003851157e645898350df00086d3e27d7c45" }
layer-mesh = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "f089003851157e645898350df00086d3e27d7c45" }
model-tile = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "f089003851157e645898350df00086d3e27d7c45" }
map-frame = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "f089003851157e645898350df00086d3e27d7c45" }
map-worker = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "f089003851157e645898350df00086d3e27d7c45" }
map-visibility = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "f089003851157e645898350df00086d3e27d7c45" }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
