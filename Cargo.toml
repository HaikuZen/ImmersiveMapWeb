[workspace]
resolver = "3"
members = ["crates/*"]
# B17 only: built with nightly (atomics, build-std) by scripts/build-rayon.sh, kept out of the stable checks.
exclude = ["crates/bench-rayon"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
pmtiles = { path = "crates/pmtiles" }
mvt = { path = "crates/mvt" }
tile-prep = { path = "crates/tile-prep" }
earcut = "0.4"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
wgpu = { version = "30", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
