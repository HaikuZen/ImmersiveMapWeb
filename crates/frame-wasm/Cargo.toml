[package]
name = "frame-wasm"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "The per-frame logic the main thread runs in Wasm : the tile placement planner, the label collisions, the pin collision layout, the tile coverage and the tile grid."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
map-frame = { workspace = true, features = ["js-math"] }
map-visibility.workspace = true
