[workspace]
resolver = "3"
members = ["crates/*"]
# B17 only: built with nightly (atomics, build-std) by scripts/build-rayon.sh, kept out of the stable checks.
exclude = ["crates/bench-rayon"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# The shared engine code (github.com/artembobkin/ImmersiveMapCore), pinned to a
# commit. docs/Development.md says how to build against a local checkout.
pmtiles = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "c356631f9f8a9e1cceff4d6cdcb2d66c49e81321" }
tile-prep = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "c356631f9f8a9e1cceff4d6cdcb2d66c49e81321" }
ground-relief = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "c356631f9f8a9e1cceff4d6cdcb2d66c49e81321" }
layer-mesh = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "c356631f9f8a9e1cceff4d6cdcb2d66c49e81321" }
model-tile = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "c356631f9f8a9e1cceff4d6cdcb2d66c49e81321" }
map-frame = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "c356631f9f8a9e1cceff4d6cdcb2d66c49e81321" }
map-worker = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "c356631f9f8a9e1cceff4d6cdcb2d66c49e81321" }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
wgpu = { version = "30", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
