<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ImmersiveMap Web: dev</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; }
      #map { position: fixed; inset: 0 300px 0 0; }
      #panel { position: fixed; inset: 0 0 0 auto; width: 300px; box-sizing: border-box; padding: 14px; overflow-y: auto; background: #16181d; color: #e8e8e8; }
      #panel h1 { margin: 0 0 12px; font-size: 15px; }
      #panel h2 { margin: 16px 0 6px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #8b93a1; }
      #panel label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
      #panel label.check { justify-content: flex-start; }
      #panel select, #panel input[type="number"] { width: 130px; padding: 3px 6px; border: 1px solid #343843; border-radius: 6px; background: #22252d; color: inherit; font: inherit; }
      #panel input[type="number"].short { width: 56px; }
      #panel button { padding: 5px 10px; border: 1px solid #343843; border-radius: 6px; background: #22252d; color: inherit; font: inherit; cursor: pointer; }
      #panel button:hover { background: #2c303a; }
      #stats, #tiles, #events { margin: 0; padding: 8px; border-radius: 6px; background: #0e1014; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
      #tiles, #events { max-height: 150px; overflow-y: auto; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <h1>Tile grid</h1>
      <pre id="stats">starting…</pre>

      <h2>The grid</h2>
      <label class="check"><input id="shown" type="checkbox" checked /> Show the grid</label>
      <label>Zooms <span><input id="zoomMin" class="short" type="number" min="0" max="24" value="0" /> – <input id="zoomMax" class="short" type="number" min="0" max="24" value="24" /></span></label>
      <label>Text
        <select id="labelFormat"><option value="zxy">zoom/x/y</option><option value="xyz">x/y/zoom</option><option value="hidden">none</option><option value="own">the app's own</option></select>
      </label>
      <label>Line width, pt <input id="lineWidth" type="number" min="0" max="10" step="0.5" value="1" /></label>
      <label>Most tiles a frame <input id="maximumTiles" type="number" min="0" max="4096" step="64" value="512" /></label>

      <h2>The selection</h2>
      <label>Gesture
        <select id="gesture"><option value="tap">tap</option><option value="doubleTap">double tap</option><option value="secondaryTap">right click / long press</option></select>
      </label>
      <label>Mode
        <select id="mode"><option value="multiple">many tiles</option><option value="single">one tile</option></select>
      </label>
      <label>Limit (empty: none) <input id="limit" type="number" min="0" placeholder="none" /></label>
      <label class="check"><input id="tapEnabled" type="checkbox" checked /> The user can select</label>
      <label class="check"><input id="doubleTapZoom" type="checkbox" /> Double tap zooms (a tap then waits)</label>
      <label class="check"><input id="bounds" type="checkbox" /> Selectable inside the Garden Ring only</label>
      <div class="row"><button id="clear">Clear</button><button id="selectView">Select the centre tile</button></div>

      <h2>Selected tiles</h2>
      <pre id="tiles">none</pre>

      <h2>Events</h2>
      <pre id="events"></pre>

      <h2>The map</h2>
      <label class="check"><input id="night" type="checkbox" /> Night</label>
      <label class="check"><input id="flat" type="checkbox" /> Flat at every zoom</label>
      <div class="row"><button data-view="13.2,0">Above</button><button data-view="14.2,62">Tilted</button><button data-view="15.5,80">Horizon</button><button data-view="2.6,0">Globe</button></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
