[package]
name = "bench-wasm"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
miniz_oxide = "0.9"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
ground-relief.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = { version = "0.15", default-features = false, features = ["serde_impl", "runtime-detection"] }
model-tile.workspace = true
layer-mesh.workspace = true
astc-decode = "0.3"
texture-compressor = "0.2"
