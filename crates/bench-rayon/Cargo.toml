[package]
name = "bench-rayon"
edition = "2024"
license = "MIT"
version = "0.1.0"
description = "B17 only: the tile parser over a rayon pool in one shared-memory Wasm instance (wasm-bindgen-rayon), built with nightly."

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
rayon = "1.10"
wasm-bindgen-rayon = "1.3"
tile-parse = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "7021397847ba8f2c698975d5c6c575946192140b" }
map-style = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "7021397847ba8f2c698975d5c6c575946192140b" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
